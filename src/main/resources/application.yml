spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: agenda-barbearia
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: strict

app:
  security:
    admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
  messaging:
    rabbitmq:
      enabled: ${RABBITMQ_ENABLED:true}
      exchange: ${RABBITMQ_APPOINTMENT_CREATED_EXCHANGE:appointments.events}
      routing-key: ${RABBITMQ_APPOINTMENT_CREATED_ROUTING_KEY:appointment.created}
      queue: ${RABBITMQ_APPOINTMENT_CREATED_QUEUE:appointments.created}

management:
  health:
    rabbit:
      enabled: ${RABBITMQ_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
