spring:
  datasource:
    url: jdbc:h2:mem:agenda_barbearia;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  security:
    admin:
      username: test-admin
      password: test-admin-password-for-tests
  messaging:
    rabbitmq:
      enabled: false

management:
  health:
    rabbit:
      enabled: false
