services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agenda_barbearia
      MYSQL_USER: ${DB_USERNAME:-agenda_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-agenda_dev_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-agenda_root_dev}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=TCP -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
